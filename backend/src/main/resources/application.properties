spring.application.name=fake-profile-detector
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fake_profile_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-demo-secret-to-a-long-random-value-123456789}
app.jwt.expiration-ms=86400000
app.ml.url=${ML_URL:http://localhost:8000}
